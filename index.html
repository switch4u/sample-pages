<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sample Pages</title>
  <style>
    :root {
      color-scheme: light;
      --bg1: #0f172a;
      --bg2: #1e293b;
      --card: rgba(255, 255, 255, 0.12);
      --text: #e5eefc;
      --muted: #bfd0ee;
      --accent: #7dd3fc;
      --accent2: #a78bfa;
      --border: rgba(255, 255, 255, 0.18);
      --shadow: 0 20px 50px rgba(15, 23, 42, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(125, 211, 252, 0.18), transparent 32%),
        radial-gradient(circle at bottom right, rgba(167, 139, 250, 0.2), transparent 28%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(720px, 100%);
      padding: 48px 40px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--card);
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
    }

    .badge {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(125, 211, 252, 0.14);
      border: 1px solid rgba(125, 211, 252, 0.24);
      color: var(--accent);
      font-size: 0.9rem;
      letter-spacing: 0.04em;
    }

    h1 {
      margin: 20px 0 16px;
      font-size: clamp(2rem, 5vw, 3.4rem);
      line-height: 1.1;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.8;
    }

    .actions {
      margin-top: 28px;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 160px;
      padding: 14px 20px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 600;
      transition: transform 0.18s ease, opacity 0.18s ease, background 0.18s ease;
    }

    .button.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #0f172a;
    }

    .button.secondary {
      border: 1px solid var(--border);
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
    }

    .button:hover {
      transform: translateY(-2px);
      opacity: 0.95;
    }

    .footer {
      margin-top: 28px;
      font-size: 0.92rem;
      color: rgba(229, 238, 252, 0.7);
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Cloudflare Pages</span>
    <h1>シンプルだけど、ちょっと気持ちいいページへ。</h1>
    <p>
      このサンプルページは、最小構成の静的サイトを少しだけ整えたものです。
      テキスト中心でも、余白と色を少し入れるだけで見た目はかなり変わります。
    </p>
    <div class="actions">
      <a class="button primary" href="https://pages.cloudflare.com/" target="_blank" rel="noreferrer">Cloudflare Pages</a>
    </div>
    <div class="footer">sample-pages / index.html only</div>
  </main>
</body>
</html>
